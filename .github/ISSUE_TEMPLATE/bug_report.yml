name: 问题反馈 (Bug Report)
description: 报告软件运行中遇到的 Bug 或异常问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈！请先选择你反馈的软件，再详细描述问题，以便我们更快定位和处理。

  - type: dropdown
    id: software
    attributes:
      label: 反馈软件（必选）
      description: 请选择你遇到问题的软件
      options:
        - CT_Translation
        - SteamAccountManager
        - 使魔大战
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 请填写软件的版本号（可在软件内或下载页面查看）
      placeholder: 例如：CT_Translation-20261004-202129-17
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请清晰描述遇到了什么问题
      placeholder: 例如：启动后点击翻译按钮无反应
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请列出可以复现问题的操作步骤
      placeholder: |
        1. 打开软件
        2. 点击 xxx
        3. 出现 xxx
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 正常情况下应该出现什么结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际出现了什么结果（报错信息请完整粘贴）
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请填写操作系统等环境信息
      placeholder: |
        操作系统：Windows 11 23H2
      value: |
        操作系统：
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志
      description: 如有截图或日志，请粘贴（可直接粘贴图片）
    validations:
      required: false
