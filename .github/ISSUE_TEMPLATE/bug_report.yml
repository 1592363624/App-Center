name: 问题反馈 (Bug Report)
description: 报告软件运行中遇到的 Bug 或异常问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: software
    attributes:
      label: 反馈软件（必选）
      description: 请选择你遇到问题的软件
      options:
        - CT_Translation
        - SteamAccountManager
        - 使魔大战
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请简单描述遇到了什么问题
      placeholder: 例如：启动后点击翻译按钮无反应
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 如有报错日志或截图，请粘贴（可直接粘贴图片）
    validations:
      required: false
