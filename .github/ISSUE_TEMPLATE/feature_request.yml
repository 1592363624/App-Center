name: 功能建议 (Feature Request)
description: 为软件提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: software
    attributes:
      label: 反馈软件（必选）
      description: 请选择你建议针对的软件
      options:
        - 使魔大战
        - SteamAccountManager
        - CT_Translation
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 建议内容
      description: 请简单描述你希望新增或改进的功能
      placeholder: 例如：希望支持批量导出翻译结果
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明（可选）
      description: 截图、日志或其他参考信息
    validations:
      required: false
